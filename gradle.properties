# The version lives in version.txt (read by build.gradle.kts), which is also
# what the release workflow cross-checks against the tag and Cargo.toml.
group=org.eclipse.zenoh

# Gradle build settings
org.gradle.cacheTransformEventListenerEnabled=false
org.gradle.console=auto
org.gradle.daemon.performance.enable-monitoring=false
kotlin.code.style=official

# JVM settings
org.gradle.jvmargs=-Xmx4g

# Remote publication flag (set by CI)
remotePublication=false
