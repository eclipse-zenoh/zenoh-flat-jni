[package]
name = "zenoh-flat-jni"
version = "1.9.0"
edition = "2021"
description = "Zenoh JNI bindings and Kotlin wrappers - generated from zenoh-flat via prebindgen"
license = "EPL-2.0 OR Apache-2.0"
repository = "https://github.com/eclipse-zenoh/zenoh-flat-jni"
homepage = "https://zenoh.io"

[features]
default = ["zenoh-ext"]
# Gates the hand-written ZBytes serialization JNI (src/zbytes.rs), which needs
# zenoh-ext's serializer/deserializer.
zenoh-ext = ["dep:zenoh-ext"]

[dependencies]
# `unstable` must be on to match the `unstable` zenoh features enabled below:
# zenoh-flat's `unstable` feature (= `zenoh/unstable`) gates the QoS surface
# (`Reliability`, `CongestionControl::BlockFirst`, …) in lockstep with the
# zenoh enum variants, so without it the flat↔native conversions go
# non-exhaustive once Cargo unifies `zenoh` with `unstable`.
zenoh-flat = { version = "1.9.0", git = "https://github.com/eclipse-zenoh/zenoh-flat.git", branch = "main", features = ["unstable"] }
# Runtime home of the JNI binding helpers and the default `JniBindingError`
# (`::prebindgen_jni_runtime::JniBindingError`) that the generated bindings
# reference. This is the ~350-line leaf crate — a shipped binding library does
# not depend on the generator.
#
# TEMPORARY: on `branch = "main"` rather than the crates.io 0.5.0, because the
# generated code this repository now commits needs generator fixes that are
# merged but unreleased (milyin/prebindgen#404, #418, #419). Which commit that
# is, is fixed by Cargo.lock. Go back to a plain `"0.5"` on the next
# prebindgen release.
prebindgen-jni-runtime = { version = "0.5", git = "https://github.com/milyin/prebindgen.git", branch = "main" }
# Direct zenoh/zenoh-ext deps for the self-contained ZBytes serialization JNI.
# Same git rev as zenoh-flat so Cargo unifies the crate instances.
zenoh = { version = "1.9.0", git = "https://github.com/eclipse-zenoh/zenoh.git", branch = "main", features = ["unstable", "internal", "default"], default-features = false }
zenoh-ext = { version = "1.9.0", git = "https://github.com/eclipse-zenoh/zenoh.git", branch = "main", features = ["internal"], default-features = false, optional = true }
jni = "0.21.1"
konst = "0.3.17"
tracing = { version = "0.1", features = ["log"] }

[lib]
name = "zenoh_flat_jni"
# `cdylib`, not `dylib`: this library is loaded by the JVM, not linked by another
# Rust crate. cargo-ndk rejects a `dylib` outright ("No usable artifacts produced
# by cargo"), and on the desktop side cdylib is what a JNI library is meant to be
# — it exports the extern "C" surface without Rust ABI metadata.
crate-type = ["staticlib", "cdylib"]

[build-dependencies]
# Same feature set as the runtime dep so the captured `FEATURES` / cfg-gated
# `#[prebindgen]` items match what the runtime crate actually compiles.
zenoh-flat = { version = "1.9.0", git = "https://github.com/eclipse-zenoh/zenoh-flat.git", branch = "main", features = ["unstable"] }
# The generator, post-#371 split: the JNI/Kotlin adapter plus the decl macros
# (`convert!`, `fun!`, `expand_*!`, …) it shares with the language-agnostic
# pipeline.
# Same TEMPORARY git source as prebindgen-jni-runtime above.
prebindgen-jni = { version = "0.5", git = "https://github.com/milyin/prebindgen.git", branch = "main" }
prebindgen-registry = { version = "0.5", git = "https://github.com/milyin/prebindgen.git", branch = "main" }
syn = "2"

# panic = "abort" is required on the JNI boundary — a Rust panic crossing
# into the JVM under unwind is UB.
[profile.release]
debug = false
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
