name: CI

on:
  # `release/*` because that is where a release is actually built from: the
  # release workflow creates the branch through the shared
  # eclipse-zenoh/ci/create-release-branch action, and without this CI never runs
  # on it. The dry-run branches that same action produces are excluded - they are
  # throwaway.
  push:
    branches: ["main", "release/*", "!release/dry-run/*"]
  # Every branch, not just main: a backport pull request targets a release
  # branch, and it needs CI as much as any other.
  pull_request:
    branches: ["**"]
  # No schedule. zenoh, zenoh-ext and zenoh-flat are `branch = "main"` deps, but
  # Cargo.lock pins each to a commit, so a timed build rebuilds exactly what the
  # last merge did - upstream drift arrives as a lockfile-sync pull request, not
  # as a nightly failure. That leaves a nightly worth only the chance of catching
  # an expired Central token or GPG key during a week with no merges at all, and
  # it would pay for that with five ten-target publications a week.
  workflow_dispatch:

# Superseded runs are cancelled, including a snapshot publication in flight. That
# is safe here because no build resolves the coordinate this publishes: each SDK
# builds and publishes its own copy from the commit it pins (PUBLISHING.md,
# "Downstream copies of the snapshot"). A cancelled upload therefore leaves an
# artifact nobody consumes, which the next merge overwrites - the snapshot
# repository is mutable and has no staging state to unwind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to a commit, with the version in a trailing
# comment: a tag is mutable, and a moved tag runs code nobody reviewed. Actions
# under eclipse-zenoh/ are ours and stay on a branch.
#
# No Rust toolchain action either. rust-toolchain.toml pins the channel and the
# components, the runner ships rustup, and `rustup show` installs what the file
# says - the same thing publish.yml already does. Naming a version here as well
# only creates a second pin that can disagree with the first.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run format check
        run: cargo fmt --check -- --config "unstable_features=true,imports_granularity=Crate,group_imports=StdExternalCrate"

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # build.rs writes the committed artifacts on every build, and clippy above
      # already ran it — so anything it changed means the tree was stale. Staging
      # first catches emitted files that are new (plain `git diff` cannot see an
      # untracked file).
      - name: Check the committed generated artifacts are current
        run: |
          git add -A -- src/generated_bindings.rs kotlin/generated kotlin/REPORT.md
          git diff --cached --exit-code || {
            echo "::error::Generated artifacts are stale. Run 'cargo build' and commit the result."
            exit 1
          }

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup show

      - name: Install JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '11'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run tests
        run: cargo test --all --all-features --verbose

  gradle-test:
    name: Gradle test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup show

      - name: Install JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '11'

      # v5, not v6: v6 moved caching into a proprietary component under Gradle's
      # own terms of use, which is not ours to accept for an Eclipse project.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: '8.5'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Runs the Kotlin correspondence tests: each verifies a pure-Kotlin
      # implementation (Parameters, SerializationCodec, EncodingCodec, ZenohId)
      # against the native oracle in `io.zenoh.jni.test`. The `test` task builds
      # the native lib (dependsOn buildZenohFlatJni) and puts it on
      # java.library.path, so no separate cargo build step is needed.
      - name: Run Gradle tests
        # `jvmTest`, not `test`: with AGP applied, `test` is the Android unit-test
        # aggregate, and these tests are deliberately JVM-only — so `test` runs
        # nothing at all and passes.
        run: ./gradlew jvmTest --info

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build release
        run: cargo build --release

  # NOTE: In GitHub repository settings, the "Require status checks to pass
  # before merging" branch protection rule ensures that commits are only merged
  # from branches where specific status checks have passed. These checks are
  # specified manually as a list of workflow job names. Thus we use this extra
  # job to signal whether all CI checks have passed.
  ci:
    name: CI status checks
    runs-on: ubuntu-latest
    needs: [lint, test, gradle-test, build]
    if: always()
    steps:
      - name: Check whether all jobs pass
        run: echo '${{ toJson(needs) }}' | jq -e 'all(.result == "success")'

  # Publish <version.txt>-SNAPSHOT from main, the same rule zenoh-java and
  # zenoh-kotlin have always followed: publication is gated to main and runs on
  # every merge there. Nothing is published from a branch or a pull request.
  #
  # This is this repository's own upload test: signing, credentials and what
  # Central accepts are otherwise exercised only when someone dispatches a
  # release by hand. No SDK depends on the result - they publish their own
  # qualified copies - so what this buys is that the path runs on every merge
  # instead of twice a year. Snapshots are mutable, so rewriting one coordinate
  # is exactly what they are for.
  publish_snapshot_package:
    name: Publish snapshot package
    if: github.ref == 'refs/heads/main'
    needs: ci
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      packages: write
    with:
      snapshot: true
      branch: ${{ github.ref_name }}
    secrets: inherit
