name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # zenoh-flat is pinned in release-inputs.env, the same revision a release
  # builds from. prebindgen tracks `main`, but every job in a run must see the
  # *same* main: resolving it per-job lets a merge land mid-run and give two
  # jobs different generators. Resolve once here and pin the jobs to it.
  inputs:
    name: Resolve build inputs
    runs-on: ubuntu-latest
    outputs:
      zenoh_flat_ref: ${{ steps.rev.outputs.zenoh_flat_ref }}
      prebindgen_ref: ${{ steps.rev.outputs.prebindgen_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve prebindgen main to a commit
        id: rev
        shell: bash
        run: |
          set -euo pipefail
          . ./release-inputs.env
          echo "zenoh_flat_ref=$ZENOH_FLAT_REF" >> "$GITHUB_OUTPUT"
          sha=$(git ls-remote https://github.com/milyin/prebindgen.git refs/heads/main | cut -f1)
          test -n "$sha" || { echo "could not resolve prebindgen main"; exit 1; }
          echo "prebindgen main = $sha"
          echo "prebindgen_ref=$sha" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: inputs
    defaults:
      run:
        working-directory: zenoh-flat-jni
    steps:
      - uses: actions/checkout@v4
        with:
          path: zenoh-flat-jni

      - uses: ./zenoh-flat-jni/.github/actions/setup-sources
        with:
          zenoh-flat-ref: ${{ needs.inputs.outputs.zenoh_flat_ref }}
          prebindgen-ref: ${{ needs.inputs.outputs.prebindgen_ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: zenoh-flat-jni/target
          key: ${{ runner.os }}-cargo-build-target-${{ needs.inputs.outputs.zenoh_flat_ref }}-${{ needs.inputs.outputs.prebindgen_ref }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-${{ needs.inputs.outputs.zenoh_flat_ref }}-
            ${{ runner.os }}-cargo-build-target-

      - name: Run format check
        run: cargo fmt --check -- --config "unstable_features=true,imports_granularity=Crate,group_imports=StdExternalCrate"

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: inputs
    defaults:
      run:
        working-directory: zenoh-flat-jni
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: zenoh-flat-jni

      - uses: ./zenoh-flat-jni/.github/actions/setup-sources
        with:
          zenoh-flat-ref: ${{ needs.inputs.outputs.zenoh_flat_ref }}
          prebindgen-ref: ${{ needs.inputs.outputs.prebindgen_ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: zenoh-flat-jni/target
          key: ${{ runner.os }}-cargo-build-target-${{ needs.inputs.outputs.zenoh_flat_ref }}-${{ needs.inputs.outputs.prebindgen_ref }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-${{ needs.inputs.outputs.zenoh_flat_ref }}-
            ${{ runner.os }}-cargo-build-target-

      - name: Run tests
        run: cargo test --all --all-features --verbose

  gradle-test:
    name: Gradle test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: inputs
    defaults:
      run:
        working-directory: zenoh-flat-jni
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: zenoh-flat-jni

      - uses: ./zenoh-flat-jni/.github/actions/setup-sources
        with:
          zenoh-flat-ref: ${{ needs.inputs.outputs.zenoh_flat_ref }}
          prebindgen-ref: ${{ needs.inputs.outputs.prebindgen_ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: zenoh-flat-jni/target
          key: ${{ runner.os }}-gradle-test-target-${{ needs.inputs.outputs.zenoh_flat_ref }}-${{ needs.inputs.outputs.prebindgen_ref }}
          restore-keys: |
            ${{ runner.os }}-gradle-test-target-${{ needs.inputs.outputs.zenoh_flat_ref }}-
            ${{ runner.os }}-gradle-test-target-

      # Runs the Kotlin correspondence tests: each verifies a pure-Kotlin
      # implementation (Parameters, SerializationCodec, EncodingCodec, ZenohId)
      # against the native oracle in `io.zenoh.jni.test`. The `test` task builds
      # the native lib (dependsOn buildZenohFlatJni) and puts it on
      # java.library.path, so no separate cargo build step is needed.
      #
      # The committed Gradle wrapper is what release builds use; exercise it here.
      - name: Run Gradle tests
        run: ./gradlew test --info

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: inputs
    defaults:
      run:
        working-directory: zenoh-flat-jni
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: zenoh-flat-jni

      - uses: ./zenoh-flat-jni/.github/actions/setup-sources
        with:
          zenoh-flat-ref: ${{ needs.inputs.outputs.zenoh_flat_ref }}
          prebindgen-ref: ${{ needs.inputs.outputs.prebindgen_ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: zenoh-flat-jni/target
          key: ${{ runner.os }}-cargo-build-target-${{ needs.inputs.outputs.zenoh_flat_ref }}-${{ needs.inputs.outputs.prebindgen_ref }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-${{ needs.inputs.outputs.zenoh_flat_ref }}-
            ${{ runner.os }}-cargo-build-target-

      - name: Build release
        run: cargo build --release
