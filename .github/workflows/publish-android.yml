name: Publish (Android)

on:
  workflow_call:
    inputs:
      snapshot:
        description: "If the publication is for a snapshot version."
        type: boolean
        required: true
        default: false
      branch:
        description: Target branch
        type: string
        required: false
      maven_publish:
        type: boolean
        required: false
        default: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # Where the per-ABI libraries are collected before Gradle packages the AAR.
  # Kept in step with `androidLibsDir` in build.gradle.kts.
  ANDROID_LIB_PATHS: android-libs
  # `cargo install --locked` pins the dependencies of the selected release, not
  # which release is selected, so the exact version is pinned here: without it a
  # rerun of the same tag can cross-compile with a different cargo-ndk. Bumping
  # it needs a validated Android build (4.x no longer strips output by default,
  # which changes the .so sizes in the AAR).
  CARGO_NDK_VERSION: 4.1.2
  ANDROID_NDK_VERSION: r26

jobs:
  builds:
    name: Build the Android ABIs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          add-to-path: false

      # rust-toolchain.toml pins the channel; only the targets are added here.
      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add armv7-linux-androideabi aarch64-linux-android i686-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version ${{ env.CARGO_NDK_VERSION }}

      # cargo-ndk's -o writes exactly the AAR's jni/<abi>/ layout.
      - name: Build every advertised ABI
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo ndk -o ${{ env.ANDROID_LIB_PATHS }} \
            -t armeabi-v7a -t arm64-v8a -t x86 -t x86_64 \
            build --release --locked

      - name: Record the toolchain and checksums
        run: |
          {
            echo "NDK ${{ env.ANDROID_NDK_VERSION }}, cargo-ndk ${{ env.CARGO_NDK_VERSION }}"
            shasum -a 256 ${{ env.ANDROID_LIB_PATHS }}/*/libzenoh_flat_jni.so
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: android-natives
          path: ${{ env.ANDROID_LIB_PATHS }}
          if-no-files-found: error

  publish_android_package:
    name: Publish Android package
    needs: builds
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      # Maven Central releases are immutable, so republishing existing
      # coordinates cannot succeed — and discovering that mid-upload is a
      # confusing way to find out. Snapshots are exempt: they live in a
      # separate, mutable repository and may be overwritten freely.
      - name: Refuse to overwrite an existing Maven Central release
        if: ${{ inputs.snapshot == false }}
        shell: bash
        run: |
          set -euo pipefail
          v=$(tr -d '[:space:]' < version.txt)
          url="https://repo1.maven.org/maven2/org/eclipse/zenoh/zenoh-flat-jni-android/$v/zenoh-flat-jni-android-$v.pom"
          if curl -sfIL -o /dev/null "$url"; then
            echo "::error::org.eclipse.zenoh:zenoh-flat-jni-android:$v is already on Maven Central and cannot be replaced"
            exit 1
          fi
          echo "org.eclipse.zenoh:zenoh-flat-jni-android:$v is free on Maven Central" >> "$GITHUB_STEP_SUMMARY"

      - name: Create resources destination
        run: mkdir -p ${{ env.ANDROID_LIB_PATHS }}

      - name: Download result of previous builds
        uses: actions/download-artifact@v4
        with:
          name: android-natives
          path: ${{ env.ANDROID_LIB_PATHS }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set pub mode env var
        run: |
          if [[ "${{ inputs.snapshot }}" == "true" ]]; then
            echo "PUB_MODE=-PSNAPSHOT" >> $GITHUB_ENV
          else
            echo "RELEASE=closeAndReleaseSonatypeStagingRepository" >> $GITHUB_ENV
          fi

      - if: ${{ inputs.maven_publish == true }}
        name: Gradle Publish Android Package to Maven Central repository
        run: |
          ./gradlew publishAndroidPublicationToSonatypeRepository ${{ env.RELEASE }} --info -PremotePublication=true -Prelease=true ${{ env.PUB_MODE }}
        env:
          CENTRAL_SONATYPE_TOKEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
          CENTRAL_SONATYPE_TOKEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
          ORG_GPG_KEY_ID: ${{ secrets.ORG_GPG_KEY_ID }}
          ORG_GPG_SUBKEY_ID: ${{ secrets.ORG_GPG_SUBKEY_ID }}
          ORG_GPG_PRIVATE_KEY: ${{ secrets.ORG_GPG_PRIVATE_KEY }}
          ORG_GPG_PASSPHRASE: ${{ secrets.ORG_GPG_PASSPHRASE }}

      - name: Upload gradle problems report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: problem-reports-${{ github.job }}.zip
          path: ${{ github.workspace }}/build/reports/problems/
