#
# Both publications are released from a *single* Gradle invocation, so both land
# in one staging repository and are released together. Splitting them across two
# workflows — in either order — leaves a window where one artifact is public and
# the other never appears, and a Maven Central release cannot be withdrawn.
#
name: Publish

on:
  workflow_call:
    inputs:
      snapshot:
        description: "If the publication is for a snapshot version."
        type: boolean
        required: true
        default: false
      branch:
        description: Target branch
        type: string
        required: false
      maven_publish:
        type: boolean
        required: false
        default: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # Where the cross-built libraries are collected before Gradle packages them.
  # Kept in step with `jniLibsDir` / `androidLibsDir` in build.gradle.kts.
  JNI_LIB_PATHS: jni-libs
  ANDROID_LIB_PATHS: android-libs
  # `cargo install --locked` pins the dependencies of the selected release, not
  # which release is selected, so each build tool's exact version is pinned here.
  # Note this pins the *executable*, not the sysroot: cross resolves its image as
  # `ghcr.io/cross-rs/<target>:<version>`, a mutable tag rather than a digest. The
  # glibc check below enforces the compatibility bound we promise; it does not
  # otherwise fix the image.
  CROSS_VERSION: 0.2.5
  # The oldest glibc a release promises to run on. Currently the cross images
  # produce 2.18; the margin is deliberate, so a benign image bump does not fail
  # a release while a consequential one still does.
  SUPPORTED_GLIBC: "2.28"
  CARGO_NDK_VERSION: 4.1.2
  ANDROID_NDK_VERSION: r26

jobs:
  desktop-natives:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds go through `cross`, which compiles inside a container
          # with a much older glibc. Built natively on ubuntu-latest (24.04) the
          # library requires GLIBC_2.39 and will not load on Ubuntu 22.04,
          # Debian 12 or RHEL 9 — a floor most users would hit before us.
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-latest,  lib: libzenoh_flat_jni.so,    build-cmd: cross }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest,  lib: libzenoh_flat_jni.so,    build-cmd: cross }
          - { target: x86_64-apple-darwin,       os: macos-latest,   lib: libzenoh_flat_jni.dylib, build-cmd: cargo }
          - { target: aarch64-apple-darwin,      os: macos-latest,   lib: libzenoh_flat_jni.dylib, build-cmd: cargo }
          - { target: x86_64-pc-windows-msvc,    os: windows-latest, lib: zenoh_flat_jni.dll,      build-cmd: cargo }
          - { target: aarch64-pc-windows-msvc,   os: windows-latest, lib: zenoh_flat_jni.dll,      build-cmd: cargo }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      # No toolchain is named here on purpose: rust-toolchain.toml pins it, and
      # the release must use the same compiler CI and the lockfile sync use.
      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Install cross
        if: matrix.build-cmd == 'cross'
        run: cargo install cross --locked --version ${{ env.CROSS_VERSION }}

      - name: Build
        run: ${{ matrix.build-cmd }} build --release --locked --target ${{ matrix.target }}

      # build.rs rewrites the committed bindings on every build. A diff means the
      # release would ship generated sources nobody reviewed. Checked once, on
      # the host target, since the output does not vary per target.
      - name: Fail on generated-source drift
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          git add -A -- src/generated_bindings.rs kotlin/generated kotlin/REPORT.md
          git diff --cached --exit-code || {
            echo "::error::Generated artifacts are stale. Run 'cargo build' and commit the result."
            exit 1
          }

      # The JAR resource layout NativeLibrary.determineTarget() resolves:
      # <target>/<target>.zip holding exactly the one library.
      - name: Packaging
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/${{ env.JNI_LIB_PATHS }}/${{ matrix.target }}"
          mkdir -p "$out"
          cd "target/${{ matrix.target }}/release"
          if command -v zip >/dev/null; then
            zip -j "$out/${{ matrix.target }}.zip" "${{ matrix.lib }}"
          else
            7z -y a "$out/${{ matrix.target }}.zip" "${{ matrix.lib }}"
          fi
          cd "$GITHUB_WORKSPACE/${{ env.JNI_LIB_PATHS }}"
          # Informational only, so it must never fail the build — a release once
          # died here on exit 127. Git Bash on the Windows runners has sha256sum
          # but no shasum; macOS has shasum but no sha256sum.
          archive="${{ matrix.target }}/${{ matrix.target }}.zip"
          { shasum -a 256 "$archive" 2>/dev/null \
            || sha256sum "$archive" 2>/dev/null \
            || echo "$archive (checksum unavailable)"; } >> "$GITHUB_STEP_SUMMARY"

      # The glibc floor is a user-visible property of the release, so measure it
      # and fail on it — a number in a job summary that nobody reads is not a
      # guarantee. `readelf` parses the ELF directly and is architecture-
      # independent, unlike anything relying on a BFD backend.
      - name: Check the glibc requirement
        if: matrix.build-cmd == 'cross'
        shell: bash
        run: |
          lib="target/${{ matrix.target }}/release/${{ matrix.lib }}"
          floor=$(readelf -V "$lib" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "${{ matrix.target }} requires glibc ${floor:-none} (cross ${{ env.CROSS_VERSION }})" >> "$GITHUB_STEP_SUMMARY"
          if [ "$(printf '%s\n%s\n' "$floor" "$SUPPORTED_GLIBC" | sort -V | tail -1)" != "$SUPPORTED_GLIBC" ]; then
            echo "::error::${{ matrix.target }} requires glibc $floor, above the supported $SUPPORTED_GLIBC"
            exit 1
          fi
        env:
          SUPPORTED_GLIBC: ${{ env.SUPPORTED_GLIBC }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: ${{ env.JNI_LIB_PATHS }}
          if-no-files-found: error

  android-natives:
    name: Build the Android ABIs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          add-to-path: false

      # rust-toolchain.toml pins the channel; only the targets are added here.
      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add armv7-linux-androideabi aarch64-linux-android i686-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version ${{ env.CARGO_NDK_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      # Through the Gradle task, not a copy of its command line: `buildAndroidLibs`
      # is what the README tells a developer to run, so CI exercising the same
      # entry point is what keeps the two from drifting. cargo-ndk's -o writes
      # exactly the AAR's jni/<abi>/ layout, so nothing is repackaged.
      - name: Build every advertised ABI
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: ./gradlew buildAndroidLibs

      - name: Record the toolchain and checksums
        run: |
          {
            echo "NDK ${{ env.ANDROID_NDK_VERSION }}, cargo-ndk ${{ env.CARGO_NDK_VERSION }}"
            shasum -a 256 ${{ env.ANDROID_LIB_PATHS }}/*/libzenoh_flat_jni.so
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: android-natives
          path: ${{ env.ANDROID_LIB_PATHS }}
          if-no-files-found: error

  # Maven Central releases are immutable, so the candidate is consumed as a real
  # Maven dependency before it is published anywhere. The consumer resolves from
  # an isolated file repository with content filters, so it cannot silently fall
  # back to Central and pass against an older release.
  consumer-test:
    name: Consume the candidate on ${{ matrix.os }}
    needs: desktop-natives
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Create resources destination
        shell: bash
        run: mkdir -p ${{ env.JNI_LIB_PATHS }}

      - name: Download result of previous builds
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: ${{ env.JNI_LIB_PATHS }}

      # The layout Gradle expects is `<target>/<target>.zip` directly under
      # jni-libs/. Printing it makes a mismatch obvious in the log instead of
      # only surfacing as verifyDesktopArtifact's "missing native resource".
      - name: Show the downloaded layout
        shell: bash
        run: find ${{ env.JNI_LIB_PATHS }} -type f | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      # Must match what the publish job will use, so the smoke test exercises the
      # coordinates that actually get published rather than a same-content
      # artifact under a different version.
      - name: Set pub mode env var
        shell: bash
        run: |
          if [[ "${{ inputs.snapshot }}" == "true" ]]; then
            echo "PUB_MODE=-PSNAPSHOT" >> $GITHUB_ENV
          fi

      # No `-PremotePublication=true` here: that switches on signing, and this
      # job has no GPG secrets. The JAR is the same multi-platform artifact
      # either way — `jni-libs/` being present is what selects that layout — and
      # verifyDesktopArtifact still runs.
      - name: Publish the candidate to an isolated file repository
        run: |
          ./gradlew publishKotlinMultiplatformPublicationToDryRunRepository \
                    publishJvmPublicationToDryRunRepository \
                    -Prelease=true ${{ env.PUB_MODE }} --no-daemon

      # Resolved through the file repository, with `--refresh-dependencies` so a
      # cached artifact of the same coordinates cannot stand in for it.
      - name: Smoke-test the candidate as an external consumer
        working-directory: ci/consumer-smoke-test
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_WORKSPACE/build/dry-run-repository"
          version=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/version.txt")
          if [[ "${{ inputs.snapshot }}" == "true" ]]; then
            version="$version-SNAPSHOT"
          fi
          echo "Consuming org.eclipse.zenoh:zenoh-flat-jni:$version"
          gradle run --no-daemon --refresh-dependencies \
            -PcandidateRepository="file://$repo" \
            -PcandidateVersion="$version"

  publish:
    name: Publish to Maven Central
    needs: [desktop-natives, android-natives, consumer-test]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Check that every version declaration agrees
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < version.txt)
          cargo_version=$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)
          test "$cargo_version" = "$version" \
            || { echo "::error::Cargo.toml says $cargo_version, version.txt says $version"; exit 1; }
          echo "Publishing $version" >> "$GITHUB_STEP_SUMMARY"

      # All three coordinates are checked before any is published. Central releases
      # are immutable, so republishing cannot succeed — and an occupied *Android*
      # coordinate must not be discovered after the JVM artifact is already
      # public. Snapshots are exempt: they live in a mutable repository.
      - name: Refuse to overwrite an existing Maven Central release
        if: ${{ inputs.snapshot == false }}
        shell: bash
        run: |
          set -euo pipefail
          v=$(tr -d '[:space:]' < version.txt)
          for artifact in zenoh-flat-jni zenoh-flat-jni-jvm zenoh-flat-jni-android; do
            url="https://repo1.maven.org/maven2/org/eclipse/zenoh/$artifact/$v/$artifact-$v.pom"
            if curl -sfIL -o /dev/null "$url"; then
              echo "::error::org.eclipse.zenoh:$artifact:$v is already on Maven Central and cannot be replaced"
              exit 1
            fi
            echo "org.eclipse.zenoh:$artifact:$v is free on Maven Central" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Create resources destinations
        run: mkdir -p ${{ env.JNI_LIB_PATHS }} ${{ env.ANDROID_LIB_PATHS }}

      - name: Download the desktop natives
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: ${{ env.JNI_LIB_PATHS }}

      - name: Download the Android natives
        uses: actions/download-artifact@v4
        with:
          name: android-natives
          path: ${{ env.ANDROID_LIB_PATHS }}

      - name: Show the downloaded layout
        shell: bash
        run: find ${{ env.JNI_LIB_PATHS }} ${{ env.ANDROID_LIB_PATHS }} -type f | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Both artifacts are assembled and verified before anything is uploaded,
      # so a `maven_publish: false` rehearsal still exercises every check.
      # verifyDesktopArtifact and verifyAndroidArtifact otherwise only run as
      # dependencies of a publication task.
      - name: Assemble and verify both artifacts
        run: ./gradlew jvmJar assembleRelease verifyDesktopArtifact verifyAndroidArtifact -Prelease=true -PprebuiltAndroidLibs=true

      - name: Set pub mode env var
        # Note: This step is intended to allow publishing snapshot packages.
        # It allows to optionally append the property -PSNAPSHOT to the gradle
        # publication task on the next step, resulting in the package version
        # following the convention '<version>-SNAPSHOT'. Snapshots go to a
        # separate repository that is not staged, so they are not closed either.
        run: |
          if [[ "${{ inputs.snapshot }}" == "true" ]]; then
            echo "PUB_MODE=-PSNAPSHOT" >> $GITHUB_ENV
          else
            echo "RELEASE=closeAndReleaseSonatypeStagingRepository" >> $GITHUB_ENV
          fi

      # One Gradle invocation, so both publications go into the same staging
      # repository and are released by the single closeAndRelease that follows
      # them. Either both artifacts become public or neither does.
      - if: ${{ inputs.maven_publish == true }}
        name: Gradle Publish to Maven Central repository
        run: |
          ./gradlew publishKotlinMultiplatformPublicationToSonatypeRepository \
                    publishJvmPublicationToSonatypeRepository \
                    publishAndroidReleasePublicationToSonatypeRepository \
                    ${{ env.RELEASE }} --info -PremotePublication=true -Prelease=true \
                    -PprebuiltAndroidLibs=true ${{ env.PUB_MODE }}
        env:
          CENTRAL_SONATYPE_TOKEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
          CENTRAL_SONATYPE_TOKEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
          ORG_GPG_KEY_ID: ${{ secrets.ORG_GPG_KEY_ID }}
          ORG_GPG_SUBKEY_ID: ${{ secrets.ORG_GPG_SUBKEY_ID }}
          ORG_GPG_PRIVATE_KEY: ${{ secrets.ORG_GPG_PRIVATE_KEY }}
          ORG_GPG_PASSPHRASE: ${{ secrets.ORG_GPG_PASSPHRASE }}

      - name: Upload gradle problems report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: problem-reports-${{ github.job }}.zip
          path: ${{ github.workspace }}/build/reports/problems/
